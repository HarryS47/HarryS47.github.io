<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3 Style Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using a bold, clean font similar to the game's UI -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Background decorative watermarks/stripes -->
    <div class="bg-stripe"></div>

    <div class="container">
        <!-- Slanted Header Menu -->
        <header class="p3-header">
            <h1 class="p3-title">STATUS</h1>
        </header>

        <!-- Main Content Card with Clip-Path -->
        <main class="p3-card">
            <div class="card-accent"></div>
            <div class="card-content">
                <h2>HERO / LEVEL 99</h2>
                <p>Web Developer & Designer. Specializing in high-contrast, kinetic user interfaces inspired by Atlus RPGs.</p>
                
                <!-- Stylized Action Button -->
                <a href="https://github.com" class="p3-btn">
                    <span>ENTER SYSTEM</span>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
