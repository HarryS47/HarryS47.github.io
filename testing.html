<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.E.E.S. Terminal UI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importing Montserrat & Archivo for that ultra-heavy Gothic look -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Dark Hour Background Overlay -->
    <div class="p3-grid-bg"></div>

    <!-- Main Navigation Menu -->
    <nav class="p3-menu-container">
        <ul>
            <li class="p3-menu-item">
                <!-- Hovering Shape Backdrop Layer -->
                <div class="hover-shape"></div>
                <a href="#status" class="p3-link">
                    <span class="p3-text" data-text="STATUS">STATUS</span>
                </a>
            </li>
            <li class="p3-menu-item">
                <div class="hover-shape"></div>
                <a href="#skills" class="p3-link">
                    <span class="p3-text" data-text="SKILLS">SKILLS</span>
                </a>
            </li>
            <li class="p3-menu-item">
                <div class="hover-shape"></div>
                <a href="#equip" class="p3-link">
                    <span class="p3-text" data-text="EQUIP">EQUIP</span>
                </a>
            </li>
            <li class="p3-menu-item">
                <div class="hover-shape"></div>
                <a href="#system" class="p3-link">
                    <span class="p3-text" data-text="SYSTEM">SYSTEM</span>
                </a>
            </li>
        </ul>
    </nav>

</body>
</html>
