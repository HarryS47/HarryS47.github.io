<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Persona Style UI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="menu">

        <!-- =========================
             WALLET
             ========================= -->
        <section class="wallet">
            <div class="money">¥3,000</div>
            <div class="wallet-label">current wallet</div>
        </section>


        <!-- =========================
             MAIN MENU
             ========================= -->
        <nav class="main-menu">
            <a href="#" class="selected">SKILL</a>
            <a href="#">EQUIP</a>
            <a href="#">PERSONA</a>
            <a href="#">STATS</a>
            <a href="#">QUEST</a>
            <a href="#">SOCIAL LINK</a>
            <a href="#">CALENDAR</a>
            <a href="#">SYSTEM</a>
        </nav>


        <!-- =========================
             PARTY MEMBERS
             ========================= -->
        <aside class="party">

            <div class="party-member">
                Member 1
            </div>

            <div class="party-member">
                Member 2
            </div>

            <div class="party-member">
                Member 3
            </div>

        </aside>


        <!-- =========================
             CONTROLS
             ========================= -->
        <section class="controls">

            <div class="skill-prompt">
                Use a Skill
            </div>

            <div class="buttons">
                <span>A</span> Confirm
                <span>B</span> Close
            </div>

        </section>

    </main>

</body>
</html>
